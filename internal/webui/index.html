<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argus - rapport de posture</title>
<style>
  :root{
    --ground:#E7EAE4;
    --paper:#F3F5F0;
    --grid:#CDD4C9;
    --grid-fine:#DDE2D9;
    --ink:#1B211E;
    --ink-soft:#5C655F;
    --rule:#B9C1B5;
    --integrity:#2F4B4F;
    --hardening:#635AA0;
    --crit:#8E2C24;
    --high:#AF5320;
    --med:#8C7010;
    --low:#456A52;
    --accepted:#6E6A61;
    --mono:ui-monospace,"Cascadia Mono","Cascadia Code",Consolas,"SF Mono","DejaVu Sans Mono",monospace;
    --sans:ui-sans-serif,"Segoe UI",Roboto,-apple-system,"Helvetica Neue",sans-serif;
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    background:var(--ground);
    /* Graph paper: the report is a measurement, so it sits on a graticule. */
    background-image:
      linear-gradient(var(--grid-fine) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid-fine) 1px,transparent 1px);
    background-size:22px 22px;
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.55;
  }

  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 72px}

  /* ---------- masthead ---------- */
  .masthead{
    display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 18px;
    padding-bottom:14px;border-bottom:2px solid var(--ink);
  }
  .wordmark{
    font-family:var(--mono);font-weight:700;font-size:26px;
    letter-spacing:.34em;text-transform:uppercase;margin:0;
  }
  .masthead .meta{
    font-family:var(--mono);font-size:12px;color:var(--ink-soft);
    letter-spacing:.02em;
  }
  .masthead .meta b{color:var(--ink);font-weight:600}
  .colophon{
    font-family:var(--mono);font-size:11px;color:var(--ink-soft);
    letter-spacing:.06em;margin:8px 0 0;
  }

  /* ---------- the reading ---------- */
  .reading{
    display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);
    gap:34px;align-items:start;margin:34px 0 10px;
  }
  @media (max-width:820px){.reading{grid-template-columns:1fr}}

  .plot{
    background:var(--paper);
    border:1px solid var(--rule);
    padding:14px;
  }
  .plot svg{display:block;width:100%;height:auto}
  .plot figcaption{
    font-family:var(--mono);font-size:11px;color:var(--ink-soft);
    letter-spacing:.05em;margin-top:10px;
  }

  .verdict{margin:0 0 22px;font-size:22px;line-height:1.35;max-width:32ch}

  .axes{display:grid;gap:16px}
  .axis{border-left:3px solid var(--rule);padding-left:14px}
  .axis[data-axis="integrity"]{border-left-color:var(--integrity)}
  .axis[data-axis="hardening"]{border-left-color:var(--hardening)}
  .axis .label{
    font-family:var(--mono);font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink-soft);
  }
  .axis .value{font-family:var(--mono);font-size:30px;font-weight:700;line-height:1.1}
  .axis .value .of{font-size:14px;font-weight:400;color:var(--ink-soft)}
  .axis .value .grade{margin-left:10px;font-size:18px}
  .axis .note{font-size:13px;color:var(--ink-soft)}

  /* ---------- filters ---------- */
  .filters{
    display:flex;flex-wrap:wrap;gap:8px;
    margin:36px 0 18px;padding-top:18px;border-top:1px solid var(--rule);
  }
  .chip{
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    background:transparent;border:1px solid var(--rule);color:var(--ink-soft);
    padding:6px 12px;cursor:pointer;
  }
  .chip:hover{border-color:var(--ink);color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .chip:focus-visible{outline:2px solid var(--hardening);outline-offset:2px}

  /* ---------- findings ---------- */
  .group-title{
    font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--ink-soft);margin:30px 0 10px;
  }
  .finding{
    background:var(--paper);border:1px solid var(--rule);
    border-left:4px solid var(--rule);
    padding:14px 16px;margin-bottom:10px;
  }
  .finding[data-sev="CRITICAL"]{border-left-color:var(--crit)}
  .finding[data-sev="HIGH"]{border-left-color:var(--high)}
  .finding[data-sev="MEDIUM"]{border-left-color:var(--med)}
  .finding[data-sev="LOW"]{border-left-color:var(--low)}
  .finding.is-accepted{border-left-color:var(--accepted);border-style:dashed}

  .finding .head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline}
  .sev{
    font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;
  }
  .sev[data-sev="CRITICAL"]{color:var(--crit)}
  .sev[data-sev="HIGH"]{color:var(--high)}
  .sev[data-sev="MEDIUM"]{color:var(--med)}
  .sev[data-sev="LOW"]{color:var(--low)}
  .finding h3{margin:0;font-size:15px;font-weight:600;flex:1 1 320px}
  .fid{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
  .finding p{margin:8px 0 0;font-size:14px;color:var(--ink-soft)}
  .fix{margin-top:8px;font-size:14px}
  .fix::before{content:"→ ";color:var(--hardening);font-weight:700}
  .refs{margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
  .why{margin-top:8px;font-size:13px;font-style:italic;color:var(--ink-soft)}

  details.evidence{margin-top:10px}
  details.evidence summary{
    font-family:var(--mono);font-size:11px;letter-spacing:.08em;
    color:var(--ink-soft);cursor:pointer;
  }
  details.evidence summary:focus-visible{outline:2px solid var(--hardening);outline-offset:2px}
  details.evidence ul{
    margin:8px 0 0;padding-left:18px;font-family:var(--mono);font-size:12px;
    color:var(--ink-soft);word-break:break-all;
  }

  .empty{
    background:var(--paper);border:1px dashed var(--rule);
    padding:26px;text-align:center;color:var(--ink-soft);
  }

  footer{
    margin-top:44px;padding-top:16px;border-top:1px solid var(--rule);
    display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
    font-family:var(--mono);font-size:11px;color:var(--ink-soft);
  }
  footer button{
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    background:var(--ink);color:var(--paper);border:0;padding:8px 14px;cursor:pointer;
  }
  footer button:focus-visible{outline:2px solid var(--hardening);outline-offset:2px}

  /* The point travels from the origin to its reading, once, on load. */
  @keyframes settle{from{transform:translate(-100px,100px);opacity:0}to{transform:none;opacity:1}}
  .marker{animation:settle .9s cubic-bezier(.2,.8,.25,1) both}
  @media (prefers-reduced-motion:reduce){.marker{animation:none}}
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <h1 class="wordmark">Argus</h1>
    <p class="meta" id="hostmeta">lecture en cours</p>
  </header>
  <p class="colophon" id="colophon"></p>

  <section class="reading" aria-labelledby="reading-title">
    <h2 id="reading-title" class="sr-only" hidden>Relevé</h2>

    <figure class="plot">
      <svg id="plot" viewBox="0 0 340 340" role="img" aria-labelledby="plotdesc"></svg>
      <figcaption id="plotdesc">
        Durcissement en abscisse, integrite en ordonnee. Les deux mesures sont
        independantes : une machine saine peut etre mal configuree, et l'inverse.
      </figcaption>
    </figure>

    <div>
      <p class="verdict" id="verdict"></p>
      <div class="axes">
        <div class="axis" data-axis="integrity">
          <div class="label">Integrite</div>
          <div class="value" id="int-value"></div>
          <div class="note">Y a-t-il une trace d'alteration ?</div>
        </div>
        <div class="axis" data-axis="hardening">
          <div class="label">Durcissement</div>
          <div class="value" id="hard-value"></div>
          <div class="note">La machine resiste-t-elle a une attaque ?</div>
        </div>
      </div>
    </div>
  </section>

  <nav class="filters" id="filters" aria-label="Filtrer les constats"></nav>

  <main id="findings"></main>

  <footer>
    <span id="counts"></span>
    <button type="button" id="close">Fermer le rapport</button>
  </footer>
</div>

<script>
(function(){
  "use strict";
  var token = new URLSearchParams(location.search).get("t") || "";
  var q = function(p){ return p + (p.indexOf("?") < 0 ? "?" : "&") + "t=" + encodeURIComponent(token); };
  var SEV = ["CRITICAL","HIGH","MEDIUM","LOW"];
  var report = null, filter = "open";

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  fetch(q("/report.json"))
    .then(function(r){ if(!r.ok){ throw new Error("réponse " + r.status); } return r.json(); })
    .then(function(data){ report = data; render(); })
    .catch(function(err){
      document.getElementById("findings").innerHTML =
        '<div class="empty">Le rapport n\'a pas pu être chargé (' + esc(err.message) +
        '). Relancez <code>argus serve</code>.</div>';
    });

  function render(){
    var h = report.hardening || {}, i = report.integrity || {};

    document.getElementById("hostmeta").innerHTML =
      "<b>" + esc(report.host.hostname) + "</b> · " + esc(report.host.platform) +
      " · " + esc(report.host.os) + "/" + esc(report.host.arch) +
      " · " + esc(new Date(report.finished_at).toLocaleString("fr-FR"));

    document.getElementById("colophon").textContent =
      "Argus " + report.version + "  ·  Editeur : " + (report.author || "") +
      "  ·  " + (report.repository || "");

    document.getElementById("verdict").textContent = report.verdict || "";
    axisValue("int-value", i);
    axisValue("hard-value", h);
    drawPlot(h.score || 0, i.score || 0);
    buildFilters();
    renderFindings();
  }

  function axisValue(id, a){
    var el = document.getElementById(id);
    var raw = (a.accepted > 0 && a.raw_score !== a.score)
      ? ' <span class="of">(' + a.raw_score + ' sans dérogation)</span>' : "";
    el.innerHTML = a.score + '<span class="of">/100</span>' +
                   '<span class="grade">' + esc(a.grade) + "</span>" + raw;
  }

  /* The signature: a two-axis plot. Quadrants say what the pair of scores
     means, which a single ring score structurally cannot express. */
  function drawPlot(hard, integ){
    var S = 340, PAD = 42, SIZE = S - PAD * 2;
    var x = function(v){ return PAD + (v / 100) * SIZE; };
    var y = function(v){ return S - PAD - (v / 100) * SIZE; };
    var HX = 80, HY = 90; // quadrant dividers
    var p = [];

    for (var v = 0; v <= 100; v += 10){
      p.push('<line x1="' + x(v) + '" y1="' + y(0) + '" x2="' + x(v) + '" y2="' + y(100) +
             '" stroke="var(--grid)" stroke-width="' + (v % 50 === 0 ? 1 : .5) + '"/>');
      p.push('<line x1="' + x(0) + '" y1="' + y(v) + '" x2="' + x(100) + '" y2="' + y(v) +
             '" stroke="var(--grid)" stroke-width="' + (v % 50 === 0 ? 1 : .5) + '"/>');
    }
    p.push('<line x1="' + x(HX) + '" y1="' + y(0) + '" x2="' + x(HX) + '" y2="' + y(100) +
           '" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/>');
    p.push('<line x1="' + x(0) + '" y1="' + y(HY) + '" x2="' + x(100) + '" y2="' + y(HY) +
           '" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/>');

    var quads = [
      { tx: x(2),  ty: y(97), a: "start", t: "sain, peu durci" },
      { tx: x(98), ty: y(97), a: "end",   t: "sain et durci" },
      { tx: x(2),  ty: y(3),  a: "start", t: "altéré et exposé" },
      { tx: x(98), ty: y(3),  a: "end",   t: "durci mais altéré" }
    ];
    quads.forEach(function(qd){
      p.push('<text x="' + qd.tx + '" y="' + qd.ty + '" text-anchor="' + qd.a +
             '" font-size="8.5" fill="var(--ink-soft)" font-family="var(--mono)" ' +
             'letter-spacing="1">' + esc(qd.t) + "</text>");
    });

    p.push('<line x1="' + x(0) + '" y1="' + y(0) + '" x2="' + x(100) + '" y2="' + y(0) +
           '" stroke="var(--hardening)" stroke-width="2"/>');
    p.push('<line x1="' + x(0) + '" y1="' + y(0) + '" x2="' + x(0) + '" y2="' + y(100) +
           '" stroke="var(--integrity)" stroke-width="2"/>');

    p.push('<g class="marker">');
    p.push('<line x1="' + x(hard) + '" y1="' + y(integ) + '" x2="' + x(hard) + '" y2="' + y(0) +
           '" stroke="var(--hardening)" stroke-width="1" stroke-dasharray="2 3"/>');
    p.push('<line x1="' + x(hard) + '" y1="' + y(integ) + '" x2="' + x(0) + '" y2="' + y(integ) +
           '" stroke="var(--integrity)" stroke-width="1" stroke-dasharray="2 3"/>');
    p.push('<circle cx="' + x(hard) + '" cy="' + y(integ) + '" r="9" fill="var(--paper)" ' +
           'stroke="var(--ink)" stroke-width="2"/>');
    p.push('<circle cx="' + x(hard) + '" cy="' + y(integ) + '" r="3" fill="var(--ink)"/>');
    p.push("</g>");

    p.push('<text x="' + x(50) + '" y="' + (S - 12) + '" text-anchor="middle" font-size="9" ' +
           'fill="var(--hardening)" font-family="var(--mono)" letter-spacing="2">DURCISSEMENT</text>');
    p.push('<text x="14" y="' + y(50) + '" text-anchor="middle" font-size="9" ' +
           'fill="var(--integrity)" font-family="var(--mono)" letter-spacing="2" ' +
           'transform="rotate(-90 14 ' + y(50) + ')">INTEGRITE</text>');

    document.getElementById("plot").innerHTML = p.join("");
  }

  function open_(f){ return !f.passed && f.severity !== "INFO" && !f.accepted; }

  function buildFilters(){
    var defs = [{ k: "open", l: "constats ouverts" }];
    SEV.forEach(function(s){
      var n = report.findings.filter(function(f){ return open_(f) && f.severity === s; }).length;
      if (n) { defs.push({ k: s, l: s.toLowerCase() + " (" + n + ")" }); }
    });
    var acc = report.findings.filter(function(f){ return f.accepted; }).length;
    if (acc) { defs.push({ k: "accepted", l: "dérogations (" + acc + ")" }); }
    defs.push({ k: "passed", l: "contrôles réussis" });

    var nav = document.getElementById("filters");
    nav.innerHTML = "";
    defs.forEach(function(d){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = d.l;
      b.setAttribute("aria-pressed", String(d.k === filter));
      b.addEventListener("click", function(){ filter = d.k; buildFilters(); renderFindings(); });
      nav.appendChild(b);
    });

    var c = report.counts || {};
    document.getElementById("counts").textContent =
      (c.passed || 0) + " réussis · " + (c.failed || 0) + " ouverts · " +
      (c.accepted || 0) + " dérogés · " + (c.errors || 0) + " en erreur";
  }

  function selected(){
    return report.findings.filter(function(f){
      if (filter === "open") { return open_(f); }
      if (filter === "accepted") { return !!f.accepted; }
      if (filter === "passed") { return f.passed && !f.accepted; }
      return open_(f) && f.severity === filter;
    });
  }

  function renderFindings(){
    var list = selected(), host = document.getElementById("findings");
    if (!list.length){
      host.innerHTML = '<div class="empty">Rien dans cette catégorie. ' +
        'Un scan propre reste un instantané, pas une preuve d\'innocuité.</div>';
      return;
    }
    var byCat = {};
    list.forEach(function(f){ (byCat[f.category] = byCat[f.category] || []).push(f); });

    host.innerHTML = Object.keys(byCat).sort().map(function(cat){
      return '<h2 class="group-title">' + esc(cat) + "</h2>" +
             byCat[cat].map(card).join("");
    }).join("");
  }

  function card(f){
    var parts = [];
    parts.push('<article class="finding' + (f.accepted ? " is-accepted" : "") +
               '" data-sev="' + esc(f.severity) + '">');
    parts.push('<div class="head"><span class="sev" data-sev="' + esc(f.severity) + '">' +
               esc(f.severity) + '</span><h3>' + esc(f.title) +
               '</h3><span class="fid">' + esc(f.id) + "</span></div>");
    if (f.detail)      { parts.push("<p>" + esc(f.detail) + "</p>"); }
    if (f.remediation) { parts.push('<p class="fix">' + esc(f.remediation) + "</p>"); }
    if (f.accepted)    { parts.push('<p class="why">Dérogation assumée : ' + esc(f.accepted) + "</p>"); }
    if (f.references && f.references.length){
      parts.push('<p class="refs">' + f.references.map(function(r){
        return esc(r.framework) + " " + esc(r.id);
      }).join(" · ") + "</p>");
    }
    if (f.evidence && f.evidence.length){
      parts.push('<details class="evidence"><summary>' + f.evidence.length +
                 " élément(s) relevé(s)</summary><ul>" +
                 f.evidence.map(function(e){ return "<li>" + esc(e) + "</li>"; }).join("") +
                 "</ul></details>");
    }
    parts.push("</article>");
    return parts.join("");
  }

  document.getElementById("close").addEventListener("click", function(){
    fetch(q("/quit")).catch(function(){});
    document.body.innerHTML =
      '<div class="wrap"><div class="empty">Rapport fermé. Vous pouvez ' +
      'fermer cet onglet.</div></div>';
  });

  // The heartbeat is what lets the process exit when the tab is closed.
  setInterval(function(){ fetch(q("/ping")).catch(function(){}); }, 10000);
})();
</script>
</body>
</html>
