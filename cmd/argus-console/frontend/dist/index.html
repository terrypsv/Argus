<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console Argus</title>
<style>
  /* La police est celle du systeme plutot qu'une police chargee depuis le
     reseau: une application qui va chercher une police en ligne au demarrage
     est une application qui ne fonctionne pas hors connexion, ce qui serait
     absurde pour un outil qui promet de ne rien contacter. */
  :root{
    --bg:#08090B;--panel:#0B0D10;--panel2:#101318;--line:#171A1F;--line2:#242931;
    --steel:#5D6A7A;--dim:#39414C;--pale:#E8EDF2;--muted:#68717D;
    --crit:#C4705E;--high:#C47A4E;--med:#C5A33F;--low:#A9AE5B;--assume:#6E8CA0;--ok:#6FA97F;
    --mono:'Cascadia Mono','Consolas','JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--pale);font-family:var(--mono);
       font-size:13px;overflow:hidden;user-select:none}
  ::-webkit-scrollbar{width:9px}
  ::-webkit-scrollbar-thumb{background:var(--line2)}

  .app{height:100vh;display:flex;flex-direction:column}

  .chrome{height:40px;flex:0 0 40px;display:flex;align-items:center;gap:14px;
          padding:0 16px;border-bottom:1px solid var(--line);
          --wails-draggable:drag}
  .mk{font-weight:700;font-size:14px;letter-spacing:-.06em;color:var(--steel)}
  .mk i{font-style:normal;color:var(--pale)}
  .ttl{font-size:9.5px;letter-spacing:.22em;color:var(--dim)}
  .host{margin-left:auto;font-size:10px;color:var(--muted)}
  .host b{color:var(--pale);font-weight:400}

  .body{flex:1;display:flex;min-height:0}

  .nav{flex:0 0 190px;border-right:1px solid var(--line);padding:20px 0;
       display:flex;flex-direction:column}
  .nav .item{padding:11px 20px;font-size:11px;letter-spacing:.1em;color:var(--dim);
             cursor:pointer;border-left:2px solid transparent;
             display:flex;align-items:center;gap:10px}
  .nav .item:hover{color:var(--muted)}
  .nav .item.on{color:var(--pale);border-left-color:var(--pale);background:#0D1014}
  .nav .badge{margin-left:auto;font-size:9px;padding:1px 6px;border:1px solid var(--line2);
              color:var(--muted)}
  .nav .badge.alerte{color:var(--crit);border-color:var(--crit)}
  .nav .sep{height:1px;background:var(--line);margin:14px 20px}
  /* Le temoin est une pastille posee dans l'entree de menu, a droite du mot.
     L'analyse continue quand on change d'onglet, et rien ne le disait; un bloc
     separe aurait pris une place que le bandeau n'a pas. */
  .pastille{margin-left:auto;width:9px;height:9px;flex:0 0 9px;border-radius:50%;
            background:var(--med);animation:pulse 1.1s ease-in-out infinite}
  .pastille.pret{background:var(--ok);animation:none;
                 box-shadow:0 0 0 3px rgba(111,169,127,.18)}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}
                   50%{opacity:.3;transform:scale(.72)}}
  .nav .foot{margin-top:auto;padding:0 20px;font-size:9px;color:#252B33;line-height:2}

  .vue{flex:1;padding:26px 30px;overflow:auto;min-width:0;user-select:text}
  h2{font-size:18px;font-weight:500;letter-spacing:-.02em;margin-bottom:5px}
  .sub{font-size:11px;color:var(--muted);margin-bottom:22px;line-height:1.8}

  .jauges{display:flex;gap:22px;margin-bottom:24px}
  .jauge{flex:1;border:1px solid var(--line);background:var(--panel);padding:18px 20px}
  .jauge .lbl{font-size:9.5px;letter-spacing:.18em;color:var(--muted)}
  .jauge .expl{font-size:10px;color:var(--muted);line-height:1.7;margin-top:7px;
               min-height:34px}
  .jauge .val{font-size:38px;font-weight:700;letter-spacing:-.04em;margin:10px 0 2px;
              display:flex;align-items:baseline;gap:10px}
  .jauge .val small{font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0}
  .jauge .mention{font-size:15px;color:var(--muted)}
  .bar{height:4px;background:var(--line2);margin-top:12px;overflow:hidden}
  .bar i{display:block;height:100%}
  .jauge .perte{margin-top:11px;font-size:9.5px;color:var(--dim);line-height:2;
                min-height:19px}
  /* Quatre teintes chaudes qui se suivent sans se confondre, et une teinte
     froide a part pour ce qui a ete decide. Deux gravites de la meme couleur
     forcent a lire l'etiquette pour les distinguer, ce qui annule l'interet
     d'une couleur. */
  .c-crit{color:var(--crit)} .c-high{color:var(--high)}
  .c-med{color:var(--med)}   .c-low{color:var(--low)}
  .c-assume{color:var(--assume)} .c-ok{color:var(--ok)}
  .bg-crit{background:var(--crit)} .bg-med{background:var(--med)}
  .bg-ok{background:var(--ok)}

  .verdict{border-left:2px solid var(--med);padding:13px 16px;background:var(--panel);
           font-size:12px;line-height:1.85;margin-bottom:22px}
  /* La console rouvre sur la derniere analyse, ce qui est le bon comportement.
     Encore faut-il savoir de quand elle date, sinon on croit lire l'etat
     actuel de la machine. */
  .quand{font-size:10.5px;color:var(--dim);letter-spacing:.04em;margin-bottom:20px}
  .quand b{color:var(--med);font-weight:400}

  table{width:100%;border-collapse:collapse;font-size:11px}
  th{text-align:left;font-size:9px;letter-spacing:.14em;color:var(--dim);
     font-weight:400;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:10px;border-bottom:1px solid var(--line);color:var(--muted)}
  td.v{color:var(--pale)}

  .actions{display:flex;gap:8px;margin-top:22px;align-items:center;flex-wrap:wrap}
  /* Les reglages ont leur propre ligne, separee par un filet. Colles au bouton,
     ils se lisaient comme une suite de boutons, et on ne savait plus ce qui
     declenchait quoi. */
  .reglages{display:flex;gap:26px;flex-wrap:wrap;margin-top:16px;padding-top:15px;
            border-top:1px solid var(--line)}
  .btn{font-family:inherit;font-size:9.5px;letter-spacing:.14em;padding:10px 20px;
       border:1px solid var(--line2);background:transparent;color:var(--muted);
       cursor:pointer;transition:background .16s ease,border-color .16s ease,color .16s ease}
  .btn:not(.p):hover:not(:disabled){border-color:var(--steel);color:var(--pale)}
  .btn:disabled{opacity:.4;cursor:default}
  /* Le bouton principal s'assombrit au survol. La regle generale l'eclaircissait,
     ce qui donnait du blanc sur blanc: le bouton disparaissait sous la souris. */
  .btn.p{background:var(--pale);color:var(--bg);border-color:var(--pale);font-weight:600}
  .btn.p:hover:not(:disabled){background:var(--steel);border-color:var(--steel);color:var(--bg)}
  /* Une bascule plutot qu'une case. Un carre qui se remplit de blanc ne dit pas
     s'il est coche ou vide: les deux etats se ressemblent trop. Ici le curseur
     se deplace, ce qui se lit d'un coup d'oeil, et l'etiquette change de teinte. */
  .coche{display:flex;align-items:center;gap:9px;font-size:10.5px;color:var(--dim);
         cursor:pointer;padding:6px 0}
  .coche:hover{color:var(--muted)}
  .coche.on{color:var(--pale)}
  .coche b{width:30px;height:15px;border:1px solid var(--line2);display:inline-block;
           position:relative;flex:0 0 30px;transition:border-color .12s}
  .coche b::after{content:"";position:absolute;top:2px;left:2px;width:9px;height:9px;
                  background:var(--dim);transition:left .12s,background .12s}
  .coche.on b{border-color:var(--pale)}
  .coche.on b::after{left:17px;background:var(--pale)}

  .vide{border:1px solid var(--line);background:var(--panel);padding:34px 30px;
        text-align:center}
  .vide h3{font-size:14px;font-weight:500;margin-bottom:8px}
  .vide p{font-size:11.5px;color:var(--muted);line-height:1.85;max-width:440px;
          margin:0 auto 18px}
  .err{border-left:2px solid var(--crit);background:var(--panel);padding:13px 16px;
       font-size:11.5px;line-height:1.8;color:var(--muted);margin-bottom:20px}
  .err b{color:var(--pale);font-weight:500}
  .attente{font-size:11px;color:var(--muted)}
  /* --- ecran des constats --- */
  .filtres{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
  .puce{font-size:9.5px;letter-spacing:.12em;padding:6px 12px;border:1px solid var(--line2);
        color:var(--muted);cursor:pointer;transition:border-color .14s,color .14s}
  .puce:hover{color:var(--pale)}
  .puce.on{border-color:var(--pale);color:var(--pale)}
  .cst{border:1px solid var(--line);background:var(--panel);margin-bottom:7px}
  .cst .tete{display:flex;align-items:center;gap:13px;padding:13px 15px;cursor:pointer}
  .cst .tete:hover{background:#0D1014}
  .grav{font-size:9px;letter-spacing:.1em;padding:3px 7px;border:1px solid currentColor;
        min-width:56px;text-align:center;flex:0 0 auto}
  .cst .titre{font-size:12px;flex:1;line-height:1.5}
  .cst .ref{font-size:9.5px;color:var(--dim);flex:0 0 auto}
  .cst .corps{border-top:1px solid var(--line);padding:15px}
  .cst .desc{font-size:11.5px;color:var(--muted);line-height:1.85}
  .preuves{margin:13px 0;font-size:10.5px;color:var(--muted);line-height:1.95;
           max-height:230px;overflow:auto}
  .preuves div{padding-left:14px;position:relative;word-break:break-all}
  .preuves div::before{content:"-";position:absolute;left:0;color:var(--dim)}
  .fix{color:var(--steel);font-size:11.5px;line-height:1.8;margin-top:10px}
  .fix::before{content:"-> ";color:var(--dim)}
  .refs{font-size:10px;color:var(--dim);margin-top:10px}
  .assume{border-left:2px solid var(--med);padding:10px 14px;background:var(--panel2);
          font-size:11px;line-height:1.8;color:var(--muted);margin-bottom:12px}
  .assume b{color:var(--pale);font-weight:500}

  .form{border:1px solid var(--steel);background:var(--panel2);padding:18px;margin-top:14px}
  .form h4{font-size:12px;font-weight:500;margin-bottom:5px}
  .form .pourquoi{font-size:10.5px;color:var(--muted);line-height:1.8;margin-bottom:14px}
  .champ{margin-bottom:12px}
  .champ label{display:block;font-size:9px;letter-spacing:.14em;color:var(--dim);
               margin-bottom:5px}
  .champ input,.champ select{width:100%;font-family:inherit;font-size:11.5px;
       background:var(--bg);border:1px solid var(--line2);color:var(--pale);
       padding:9px 11px;outline:none;transition:border-color .14s}
  .champ input:focus,.champ select:focus{border-color:var(--steel)}
  .champ .oblig{color:var(--med)}
  .avis{border-left:2px solid var(--ok);background:var(--panel);padding:12px 15px;
        font-size:11.5px;line-height:1.8;margin-bottom:18px}
  /* La couverture des actions est declaree, pas supposee. Une table ecrite a
     la main prend du retard des qu'un controle est ajoute, et le silence
     ressemble alors a une absence de probleme. */
  .couverture{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);
              font-size:10.5px;color:var(--dim);line-height:1.9}
  .couverture b{color:var(--muted);font-weight:400}
  .avis b{color:var(--pale);font-weight:500}


  /* Pendant l'analyse, l'application dit ce qu'elle fait. Avant, la seule chose
     visible etait la fenetre de console du programme appele, ce qui donnait
     l'impression que la console avait passe la main a autre chose. */
  .encours{border:1px solid var(--line);background:var(--panel);padding:30px 28px;
           margin-bottom:22px}
  .encours h3{font-size:14px;font-weight:500;margin-bottom:9px}
  .encours p{font-size:11.5px;color:var(--muted);line-height:1.85;max-width:480px}
  .pouls{height:3px;background:var(--line2);margin:20px 0 14px;overflow:hidden;
         position:relative}
  .pouls i{position:absolute;top:0;left:0;height:100%;width:32%;background:var(--steel);
           animation:glisse 1.5s ease-in-out infinite}
  @keyframes glisse{0%{left:-32%}100%{left:100%}}
  .chrono{font-size:10px;letter-spacing:.14em;color:var(--dim)}
  .etape{font-size:12px;color:var(--pale);margin-top:4px;min-height:18px}
  .etape em{font-style:normal;color:var(--steel)}
</style>
</head>
<body>
<div class="app">
  <div class="chrome">
    <span class="mk">_<i>.</i></span>
    <span class="ttl">CONSOLE ARGUS</span>
    <span class="host" id="entete"></span>
  </div>

  <div class="body">
    <div class="nav" id="nav">
      <div class="item on" data-v="bulletin">BULLETIN</div>
      <div class="item" data-v="constats">CONSTATS <span class="badge" id="bConstats"></span></div>
      <div class="item" data-v="changements">CHANGEMENTS</div>
      <div class="item" data-v="historique">HISTORIQUE</div>
      <div class="sep"></div>
      <div class="item" data-v="exceptions">EXCEPTIONS</div>
      <div class="item" data-v="reference">RÉFÉRENCE</div>
      <div class="sep"></div>
      <div class="item" data-v="parametres">PARAMÈTRES</div>
      <div class="foot" id="pied"></div>
    </div>
    <div class="vue" id="vue"></div>
  </div>
</div>

<script>
let etat = null;
let bulletin = null;
let analyseEnCours = false;
let progression = { enCours: false, etape: "", secondes: 0 };
// Le mode retenu au lancement, fige pour la duree de l'analyse: changer la
// bascule pendant qu'elle tourne ne doit pas reecrire ce qui est affiche.
let eleveEffectif = false;
let resultatPret = false;
let constatOuvert = null;
let formulaireOuvert = null;
let filtreConstats = "tous";
let messageConstat = null;
let confirmerReference = false;
// Les ecrans et les fichiers associes aux constats sont resolus une fois, par
// le backend, plutot qu'a chaque redessin: la verification d'existence d'un
// fichier touche le disque, et la faire soixante fois par seconde pour afficher
// un bouton serait absurde.
let destinations = {};
let chemins = {};
let navigateurs = {};
const options = { rapide: true, eleve: true, profil: "workstation", verifierPaquets: false };

const go = () => window.go?.main?.App;

// ecoule rend un age en clair. "il y a 3 minutes" se comprend d'un coup d'oeil
// la ou une date seule demande un calcul mental.
function ecoule(iso){
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 90)     return "il y a moins d'une minute";
  if (s < 5400)   return "il y a " + Math.round(s / 60) + " minutes";
  if (s < 172800) return "il y a " + Math.round(s / 3600) + " heures";
  return "il y a " + Math.round(s / 86400) + " jours";
}

// --- rendu -----------------------------------------------------------------

function couleurNote(n){ return n < 60 ? "crit" : n < 80 ? "med" : "ok"; }

function jauge(titre, explication, axe){
  const c = couleurNote(axe.score);
  return `<div class="jauge">
    <div class="lbl">${titre}</div>
    <div class="expl">${explication}</div>
    <div class="val c-${c}">${axe.score} <small>/ 100</small>
      <span class="mention">${axe.grade}</span></div>
    <div class="bar"><i class="bg-${c}" style="width:${axe.score}%"></i></div>
    <div class="perte">${axe.accepted > 0
      ? axe.accepted + " constat(s) assumé(s), la note sans eux serait " + axe.raw_score
      : ""}</div>
  </div>`;
}

function vueBulletin(){
  if (!etat) return `<p class="attente">Chargement...</p>`;
  if (analyseEnCours) return vueAnalyse();

  if (!etat.argusTrouve){
    return `<h2>Argus est introuvable</h2>
      <p class="sub">La console ne refait pas le moteur d'analyse, elle appelle la ligne
         de commande. Sans elle, il n'y a rien à afficher.</p>
      <div class="err"><b>Ce qui a été cherché.</b> Le programme a été cherché à côté de
         cette application, puis dans le PATH du système. ${etat.probleme || ""}</div>
      <p class="sub">Réinstallez Argus, ou placez le programme à côté de cette
         application.</p>`;
  }

  if (!bulletin){
    return `<h2>Aucune analyse</h2>
      <p class="sub">Cette machine n'a encore jamais été analysée depuis la console.</p>
      <div class="vide">
        <h3>Commencer</h3>
        <p>Une première analyse dresse l'état de la machine. Elle ne modifie rien:
           elle lit des réglages, des fichiers et des processus, et vous rend deux notes.</p>
        ${boutons()}
      </div>`;
  }

  const b = bulletin;
  const ouverts = b.findings.filter(f => !f.passed && f.severity !== "INFO" && !f.accepted).length;
  return `
    <h2>Bulletin de posture</h2>
    <p class="sub">Deux notes, parce qu'il y a deux questions différentes. La première:
       cette machine est-elle bien fermée ? La seconde: quelqu'un y est-il déjà entré ?</p>
    <p class="quand">Analyse du ${new Date(b.finished_at).toLocaleString("fr-FR")},
       <b>${ecoule(b.finished_at)}</b>. L'état de la machine a pu changer depuis.</p>

    <div class="jauges">
      ${jauge("DURCISSEMENT",
        "Les portes que vous n'avez pas fermées: un disque non chiffré, un pare-feu éteint, un service ouvert sur le réseau.",
        b.hardening)}
      ${jauge("INTÉGRITÉ",
        "Les traces que quelqu'un est déjà passé: un fichier du système remplacé, un programme qui se lance tout seul sans être signé.",
        b.integrity)}
    </div>

    <div class="verdict">${b.verdict}</div>

    <table>
      <tr><th>RÉPARTITION</th><th>NOMBRE</th></tr>
      <tr><td>Contrôles réussis</td><td class="v">${b.counts.passed || 0}</td></tr>
      <tr><td>Écarts ouverts</td><td class="v">${ouverts}</td></tr>
      <tr><td>Assumés sciemment</td><td class="v">${b.counts.accepted || 0}</td></tr>
      <tr><td>Contrôles en erreur</td><td class="v">${b.counts.errors || 0}</td></tr>
      <tr><td>Durée de l'analyse</td><td class="v">${(b.duration_ms/1000).toFixed(1)} s</td></tr>
    </table>

    ${boutons()}`;
}

function boutons(){
  // Une option sans effet sur cette plateforme n'est pas affichee. Sous
  // Windows, l'analyse rapide ne saute rien: les parcours de disque qu'elle
  // evite n'existent que sous Linux et macOS. La proposer quand meme promet un
  // gain que l'utilisateur ne constatera jamais, et il finira par douter du
  // reste.
  let opts = "";
  if (etat?.analyseRapideUtile){
    opts += `<label class="coche ${options.rapide ? "on" : ""}" data-opt="rapide">
      <b></b>Analyse rapide</label>`;
  }
  if (etat?.elevationDisponible){
    opts += `<label class="coche ${options.eleve ? "on" : ""}" data-opt="eleve">
      <b></b>Avec les privilèges administrateur</label>`;
  }
  return `<div class="actions">
      <button class="btn p" id="lancer" ${analyseEnCours ? "disabled" : ""}>
        ${analyseEnCours ? "ANALYSE EN COURS" : "LANCER UNE ANALYSE"}</button>
    </div>
    ${opts ? `<div class="reglages">${opts}</div>` : ""}`;
}

function vueAnalyse(){
  const s = progression.secondes || 0;
  // Le texte dépend du mode, parce que les deux situations n'ont rien à voir.
  // Avec élévation, l'utilisateur attend peut-être une fenêtre d'autorisation;
  // sans, il doit savoir ce qu'il ne verra pas dans le résultat.
  const explication = eleveEffectif
    ? "L'analyse dispose des privilèges administrateur et voit l'ensemble des réglages."
    : "L'analyse tourne sans privilèges administrateur. Le chiffrement du disque, l'état de l'antivirus et une partie du registre ne pourront pas être lus, et le rapport le signalera.";
  return `<h2>Analyse en cours</h2>
    <p class="sub">Argus lit les réglages, les fichiers et les processus de cette
       machine. Il ne modifie rien.</p>
    <div class="encours">
      <h3>En cours d'examen</h3>
      <div class="etape">${progression.etape
        ? "Argus examine <em>" + progression.etape + "</em>"
        : "Préparation"}</div>
      <div class="pouls"><i></i></div>
      <div class="chrono">${s} SECONDE${s > 1 ? "S" : ""}</div>
      <p style="margin-top:16px">${explication}</p>
      <div class="actions"><button class="btn" id="annuler">ARRÊTER L'ANALYSE</button></div>
      ${eleveEffectif ? `<p class="chrono" style="margin-top:10px;letter-spacing:0;
         text-transform:none;font-size:10.5px">Windows redemandera votre autorisation:
         arrêter un programme administrateur exige les mêmes droits que le lancer.</p>` : ""}
    </div>`;
}


// --- ecran des constats ----------------------------------------------------

const GRAVITES = { CRITICAL: "crit", HIGH: "high", MEDIUM: "med", LOW: "low", INFO: "" };
const ORDRE = ["CRITICAL", "HIGH", "MEDIUM", "LOW", "INFO"];

function constatsAffichables(){
  if (!bulletin) return [];
  return bulletin.findings
    .filter(f => !f.passed && (f.severity !== "INFO" || f.error))
    .sort((a, b) => {
      // Les constats assumés passent en dernier: ce sont des décisions prises,
      // pas des points à traiter aujourd'hui.
      if (!!a.accepted !== !!b.accepted) return a.accepted ? 1 : -1;
      return ORDRE.indexOf(a.severity) - ORDRE.indexOf(b.severity);
    });
}

function vueConstats(){
  if (!bulletin){
    return `<h2>Constats</h2>
      <p class="sub">Aucune analyse n'a encore été faite sur cette machine.</p>
      <div class="vide"><h3>Rien à montrer</h3>
        <p>Lancez une analyse depuis le bulletin: les points relevés apparaîtront ici,
           avec ce qu'ils signifient et ce qu'il est possible d'en faire.</p></div>`;
  }

  const tous = constatsAffichables();
  const visibles = filtreConstats === "tous"
    ? tous
    : filtreConstats === "assumes"
      ? tous.filter(f => f.accepted)
      : tous.filter(f => f.severity === filtreConstats && !f.accepted);

  const compte = g => tous.filter(f => f.severity === g && !f.accepted).length;
  const boutonFiltre = (cle, texte, n) =>
    `<span class="puce ${filtreConstats === cle ? "on" : ""}" data-filtre="${cle}">
       ${texte}${n !== undefined ? " " + n : ""}</span>`;

  let liste = visibles.map(f => carteConstat(f)).join("");
  if (!visibles.length){
    liste = `<div class="vide"><h3>Rien dans cette catégorie</h3>
      <p>Aucun constat ne correspond au filtre choisi.</p></div>`;
  }

  // Les constats auxquels aucune action n'est associee sont comptes et nommes.
  // Sans cela, l'ajout d'un controle a l'outil passerait inapercu ici: le
  // bouton manquerait sans que rien ne le signale, et la console paraitrait
  // simplement moins utile sur ce point precis.
  const sansAction = tous.filter(f =>
    !f.accepted && !destinations[f.id] && !chemins[f.id] && !navigateurs[f.id]
    && !f.id.startsWith("INTEG-"));

  return `<h2>Constats</h2>
    <p class="sub">Chaque ligne est un point à traiter. Cliquez pour lire ce que ça veut
       dire, ce qui a été observé, et décider quoi en faire.</p>
    ${messageConstat ? `<div class="avis"><b>${messageConstat.titre}</b>
       ${messageConstat.texte}</div>` : ""}
    ${confirmerReference ? `<div class="form">
      <h4>Reprendre la référence d'intégrité</h4>
      <p class="pourquoi">La référence fige l'état actuel des fichiers critiques, et tout
         ce qui s'en écartera ensuite sera signalé. La reprendre efface donc les écarts
         constatés aujourd'hui: si l'un d'eux venait d'une altération et non d'une mise à
         jour, elle serait enregistrée comme légitime et le contrôle ne la reverrait
         jamais.</p>
      <p class="pourquoi">Ne la reprenez qu'après avoir vérifié que les fichiers modifiés
         portent une signature d'éditeur valide, ce que le rapport indique.</p>
      <div class="actions">
        <button class="btn p" data-refconfirme="1">JE CONFIRME, REPRENDRE</button>
        <button class="btn" data-refannule="1">ANNULER</button>
      </div></div>` : ""}
    <div class="filtres">
      ${boutonFiltre("tous", "TOUS", tous.length)}
      ${compte("CRITICAL") ? boutonFiltre("CRITICAL", "CRITICAL", compte("CRITICAL")) : ""}
      ${compte("HIGH") ? boutonFiltre("HIGH", "HIGH", compte("HIGH")) : ""}
      ${compte("MEDIUM") ? boutonFiltre("MEDIUM", "MEDIUM", compte("MEDIUM")) : ""}
      ${compte("LOW") ? boutonFiltre("LOW", "LOW", compte("LOW")) : ""}
      ${tous.some(f => f.accepted)
        ? boutonFiltre("assumes", "ASSUMÉS", tous.filter(f => f.accepted).length) : ""}
    </div>
    ${liste}
    ${sansAction.length ? `<div class="couverture">
      <b>${sansAction.length} constat${sansAction.length > 1 ? "s" : ""} sans écran associé:</b>
      ${sansAction.map(f => f.id).join(", ")}.
      La console sait où mènent la plupart des constats, pas tous. Pour ceux-ci, la
      remédiation décrite dans le détail reste la marche à suivre.
    </div>` : ""}`;
}

function carteConstat(f){
  const ouvert = constatOuvert === f.id;
  const c = GRAVITES[f.severity] || "";
  const etiquette = f.accepted ? "ASSUMÉ" : f.severity;
  return `<div class="cst" data-id="${f.id}">
    <div class="tete">
      <span class="grav ${f.accepted ? "c-assume" : "c-" + c}">${etiquette}</span>
      <span class="titre">${echapper(f.title)}</span>
      <span class="ref">${f.id}</span>
    </div>
    ${ouvert ? corpsConstat(f) : ""}
  </div>`;
}

function corpsConstat(f){
  const preuves = (f.evidence || []).slice(0, 40)
    .map(e => `<div>${echapper(e)}</div>`).join("");
  const reste = (f.evidence || []).length - 40;

  return `<div class="corps">
    ${f.accepted ? `<div class="assume"><b>Vous avez choisi d'assumer ce constat.</b>
       Motif: ${echapper(f.accepted)}. Il reste compté à part et n'entre pas dans
       la note, mais il n'a pas disparu.</div>` : ""}
    ${f.detail ? `<div class="desc">${echapper(f.detail)}</div>` : ""}
    ${preuves ? `<div class="preuves">${preuves}
       ${reste > 0 ? `<div style="color:var(--dim)">et ${reste} de plus</div>` : ""}</div>` : ""}
    ${f.remediation ? `<div class="fix">${echapper(f.remediation)}</div>` : ""}
    ${f.superseded ? `<div class="refs">Compté une seule fois, via ${f.superseded}.</div>` : ""}
    ${formulaireOuvert === f.id ? formulaireAcceptation(f) : `
      <div class="actions">
        ${f.accepted
          ? `<button class="btn" data-revoquer="${f.id}">NE PLUS ASSUMER</button>`
          : `<button class="btn" data-assumer="${f.id}">ASSUMER CE CONSTAT</button>`}
        ${destinations[f.id]
          ? `<button class="btn" data-reglage="${f.id}">${destinations[f.id].libelle.toUpperCase()}</button>`
          : ""}
        ${chemins[f.id]
          ? `<button class="btn" data-emplacement="${f.id}">OUVRIR L'EMPLACEMENT</button>`
          : ""}
        ${navigateurs[f.id]
          ? `<button class="btn" data-extensions="${navigateurs[f.id]}">OUVRIR LES EXTENSIONS ${navigateurs[f.id].toUpperCase()}</button>`
          : ""}
        ${f.id.startsWith("INTEG-") && f.id !== "INTEG-NOBASE"
          ? `<button class="btn" data-reference="1">REPRENDRE LA RÉFÉRENCE</button>`
          : ""}
      </div>
      <p class="refs">Argus ne modifie rien. Ces boutons ouvrent l'écran concerné;
         la décision et le réglage restent les vôtres.</p>`}
  </div>`;
}

function formulaireAcceptation(f){
  return `<div class="form">
    <h4>Assumer ce constat</h4>
    <p class="pourquoi">Il restera visible dans chaque rapport, avec sa gravité d'origine
       et votre motif. Une machine où l'on assume des constats ne peut pas se présenter
       comme irréprochable: la note sans exception reste affichée à côté de l'autre.</p>
    <div class="champ"><label>MOTIF <span class="oblig">obligatoire</span></label>
      <input id="motif" placeholder="Pourquoi ce constat est-il acceptable ?"></div>
    <div class="champ"><label>DÉCIDÉ PAR</label>
      <input id="par" placeholder="votre nom"></div>
    <div class="champ"><label>REVOIR DANS</label>
      <select id="jours">
        <option value="90">90 jours</option>
        <option value="30">30 jours</option>
        <option value="180">180 jours</option>
        <option value="0">sans échéance (déconseillé)</option>
      </select></div>
    <div class="actions">
      <button class="btn p" data-valider="${f.id}">ENREGISTRER</button>
      <button class="btn" data-annulerform="1">ANNULER</button>
    </div>
  </div>`;
}

// echapper evite qu'une preuve contenant des chevrons, ce qui arrive avec les
// permissions de navigateur comme <all_urls>, ne soit interpretee comme du
// balisage et disparaisse de l'affichage.
function echapper(t){
  return String(t === undefined || t === null ? "" : t)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function vueAVenir(nom){
  return `<h2>${nom}</h2>
    <p class="sub">Cet écran n'est pas encore construit.</p>
    <div class="vide"><h3>À venir</h3>
      <p>Le bulletin est la première tranche de la console: elle prouve que
         l'application sait lancer une analyse, lire son rapport et l'afficher.
         Les autres écrans viendront ensuite, un par un.</p></div>`;
}

const VUES = {
  bulletin: vueBulletin,
  constats: vueConstats,
  changements: () => vueAVenir("Changements"),
  historique: () => vueAVenir("Historique"),
  exceptions: () => vueAVenir("Exceptions"),
  reference: () => vueAVenir("Référence d'intégrité"),
  parametres: () => vueAVenir("Paramètres"),
};

let vueActive = "bulletin";

function dessiner(){
  document.querySelectorAll(".nav .item").forEach(i =>
    i.classList.toggle("on", i.dataset.v === vueActive));
  document.getElementById("vue").innerHTML = VUES[vueActive]();

  const b = document.getElementById("bConstats");
  if (bulletin){
    const n = bulletin.findings.filter(f => !f.passed && f.severity !== "INFO" && !f.accepted).length;
    b.textContent = n;
    b.classList.toggle("alerte", n > 0);
  } else { b.textContent = ""; }

  document.getElementById("entete").innerHTML = bulletin
    ? `${bulletin.host.hostname} - analysée le ${new Date(bulletin.finished_at).toLocaleString("fr-FR")}`
    : (etat?.argusTrouve ? "aucune analyse" : "");

  // La pastille se pose sur l'entree BULLETIN, parce que c'est la qu'il faut
  // revenir: elle indique ou regarder autant que ce qui se passe.
  const entree = document.querySelector('.nav .item[data-v="bulletin"]');
  entree.querySelector(".pastille")?.remove();
  if (progression.enCours){
    const p = document.createElement("span");
    p.className = "pastille";
    p.title = `Analyse en cours - ${progression.etape || "préparation"}`;
    entree.appendChild(p);
  } else if (resultatPret && vueActive !== "bulletin"){
    const p = document.createElement("span");
    p.className = "pastille pret";
    p.title = "Analyse terminée, le bulletin est prêt";
    entree.appendChild(p);
  }

  document.getElementById("pied").innerHTML =
    `ARGUS ${etat?.version || ""}<br>STEELVEIL`;
}

// --- actions ---------------------------------------------------------------

async function lancer(){
  if (analyseEnCours) return;
  analyseEnCours = true;
  resultatPret = false;
  eleveEffectif = !!(etat?.elevationDisponible && options.eleve);
  progression = { enCours: true, etape: "", secondes: 0 };
  dessiner();
  try {
    bulletin = await go().Analyser(options);
  } catch (e) {
    analyseEnCours = false;
    progression = { enCours: false, etape: "", secondes: 0 };
    const message = String(e);
    const abandon = message.includes("abandonn");
    document.getElementById("vue").innerHTML = abandon
      ? `<h2>Analyse abandonnée</h2>
         <p class="sub">Rien n'a été conservé: le rapport en cours d'écriture a été
            supprimé, et l'historique reste inchangé.</p>
         ${eleveEffectif ? `<div class="err"><b>Une précision.</b> L'analyse tournait
            avec les privilèges administrateur, et la console n'en dispose pas. Elle a
            donc demandé à Windows de l'arrêter, ce qui explique la seconde demande
            d'autorisation.</div>` : ""}
         ${boutons()}`
      : `<h2>L'analyse n'a pas abouti</h2>
         <div class="err"><b>Ce que le système a répondu.</b> ${message}</div>
         <p class="sub">Si vous avez refusé l'autorisation, désactivez les privilèges
            administrateur: l'analyse tournera avec une couverture réduite.</p>
         ${boutons()}`;
    dessiner_temoin_seul();
    return;
  }
  analyseEnCours = false;
  progression = { enCours: false, etape: "", secondes: 0 };
  resultatPret = true;
  dessiner();
  await resoudreActions();
  dessiner();
}

async function validerAcceptation(id){
  const motif = document.getElementById("motif")?.value?.trim() || "";
  const par = document.getElementById("par")?.value?.trim() || "";
  const jours = parseInt(document.getElementById("jours")?.value || "0", 10);

  if (!motif){
    // Le motif est refuse ici plutot que par le moteur: l'utilisateur voit
    // immediatement ce qui manque, a l'endroit ou il doit le corriger.
    const champ = document.getElementById("motif");
    champ.style.borderColor = "var(--med)";
    champ.focus();
    return;
  }

  try {
    await go().Accepter(id, motif, par, jours);
  } catch (e) {
    messageConstat = { titre: "L'enregistrement a échoué.", texte: String(e) };
    dessiner(); return;
  }

  formulaireOuvert = null;
  messageConstat = {
    titre: "Constat assumé.",
    texte: "La décision est enregistrée. Les notes ne la prendront en compte qu'à la "
         + "prochaine analyse: elles décrivent l'état constaté, pas les décisions prises depuis."
  };
  dessiner();
}

async function validerReference(){
  confirmerReference = false;
  messageConstat = { titre: "Enregistrement en cours.",
    texte: "Les empreintes des fichiers critiques sont recalculées. Windows peut demander votre autorisation." };
  dessiner();
  try {
    await go().PrendreReference(!!(etat?.elevationDisponible && options.eleve));
  } catch (e) {
    messageConstat = { titre: "La référence n'a pas pu être enregistrée.", texte: String(e) };
    dessiner(); return;
  }
  messageConstat = { titre: "Référence enregistrée.",
    texte: "Les écarts d'intégrité disparaîtront à la prochaine analyse, et tout changement ultérieur sera comparé à cet état." };
  dessiner();
}

async function validerRevocation(id){
  try {
    await go().Revoquer(id);
  } catch (e) {
    messageConstat = { titre: "La révocation a échoué.", texte: String(e) };
    dessiner(); return;
  }
  messageConstat = {
    titre: "Le constat redevient un écart ouvert.",
    texte: "Il sera de nouveau compté dans la note à la prochaine analyse, et celle-ci "
         + "baissera d'autant."
  };
  dessiner();
}

// resoudreActions demande au backend, pour chaque constat ouvert, l'ecran qui
// le gouverne et le fichier que ses preuves designent.
async function resoudreActions(){
  destinations = {}; chemins = {}; navigateurs = {};
  if (!bulletin) return;
  for (const f of bulletin.findings){
    if (f.passed || f.severity === "INFO") continue;
    try {
      const d = await go().DestinationDuConstat(f.id);
      if (d) destinations[f.id] = d;
    } catch (e) { /* un constat sans ecran connu n'est pas une erreur */ }
    for (const preuve of (f.evidence || []).slice(0, 5)){
      try {
        const c = await go().CheminDeLaPreuve(preuve);
        if (c){ chemins[f.id] = c; break; }
      } catch (e) { /* idem */ }
    }
    // Les extensions n'ont pas d'ecran Windows: elles se gerent dans le
    // navigateur qui les heberge, et le bouton n'apparait que si ce navigateur
    // est effectivement installe ici.
    if (f.id.startsWith("EXT-")){
      for (const preuve of (f.evidence || []).slice(0, 3)){
        try {
          const n = await go().NavigateurDeLaPreuve(preuve);
          if (n){ navigateurs[f.id] = n; break; }
        } catch (e) { /* idem */ }
      }
    }
  }
}

// dessiner_temoin_seul rafraichit le bandeau sans toucher a la vue, qui vient
// d'etre remplacee par un message d'erreur qu'on ne veut pas ecraser.
function dessiner_temoin_seul(){
  const t = document.getElementById("temoin");
  t.className = ""; t.innerHTML = "";
}

document.getElementById("nav").addEventListener("click", e => {
  const it = e.target.closest(".item");
  if (it){
    vueActive = it.dataset.v;
    if (vueActive === "bulletin") resultatPret = false;
    messageConstat = null;
    dessiner();
  }
});

document.getElementById("vue").addEventListener("click", async e => {
  if (e.target.closest("#lancer")) { lancer(); return; }
  if (e.target.closest("#annuler")) { go()?.Annuler(); return; }

  const filtre = e.target.closest("[data-filtre]");
  if (filtre){
    filtreConstats = filtre.dataset.filtre;
    constatOuvert = null; formulaireOuvert = null;
    dessiner(); return;
  }

  const assumer = e.target.closest("[data-assumer]");
  if (assumer){ formulaireOuvert = assumer.dataset.assumer; dessiner(); return; }

  if (e.target.closest("[data-annulerform]")){ formulaireOuvert = null; dessiner(); return; }

  const valider = e.target.closest("[data-valider]");
  if (valider){ await validerAcceptation(valider.dataset.valider); return; }

  const revoquer = e.target.closest("[data-revoquer]");
  if (revoquer){ await validerRevocation(revoquer.dataset.revoquer); return; }

  const reglage = e.target.closest("[data-reglage]");
  if (reglage){
    try { await go().OuvrirReglage(reglage.dataset.reglage); }
    catch (err) { messageConstat = { titre: "Impossible d'ouvrir cet écran.", texte: String(err) }; dessiner(); }
    return;
  }

  const ext = e.target.closest("[data-extensions]");
  if (ext){
    try { await go().OuvrirExtensions(ext.dataset.extensions); }
    catch (err) { messageConstat = { titre: "Impossible d'ouvrir le navigateur.", texte: String(err) }; dessiner(); }
    return;
  }

  if (e.target.closest("[data-reference]")){ confirmerReference = true; dessiner(); return; }
  if (e.target.closest("[data-refconfirme]")){ await validerReference(); return; }
  if (e.target.closest("[data-refannule]")){ confirmerReference = false; dessiner(); return; }

  const emplacement = e.target.closest("[data-emplacement]");
  if (emplacement){
    try { await go().OuvrirEmplacement(chemins[emplacement.dataset.emplacement]); }
    catch (err) { messageConstat = { titre: "Impossible d'ouvrir cet emplacement.", texte: String(err) }; dessiner(); }
    return;
  }

  // Le depliage vient en dernier: un clic sur un bouton interne ne doit pas
  // refermer la carte sous les doigts de celui qui vient de cliquer.
  const tete = e.target.closest(".cst .tete");
  if (tete){
    const id = tete.closest(".cst").dataset.id;
    constatOuvert = constatOuvert === id ? null : id;
    formulaireOuvert = null;
    dessiner(); return;
  }
  const c = e.target.closest(".coche");
  if (c){ options[c.dataset.opt] = !options[c.dataset.opt]; dessiner(); }
});

// --- demarrage -------------------------------------------------------------

window.addEventListener("DOMContentLoaded", async () => {
  // Wails injecte ses liaisons apres le chargement du document: appeler le
  // backend immediatement echouerait une fois sur deux, et de facon
  // intermittente, ce qui est le pire genre de defaut.
  const attendre = setInterval(async () => {
    if (!go()) return;
    clearInterval(attendre);
    etat = await go().EtatInitial();
    bulletin = await go().DernierBulletin();
    await resoudreActions();
    // Le backend pousse l'avancement plutot que l'interface ne l'interroge:
    // une analyse qui dure passe ainsi son etape en cours sans qu'on ait a
    // choisir un rythme d'interrogation, toujours soit trop lent soit inutile.
    window.runtime?.EventsOn("progression", p => {
      progression = p;
      if (analyseEnCours) dessiner();
    });
    dessiner();
  }, 30);
  dessiner();
});
</script>
</body>
</html>
